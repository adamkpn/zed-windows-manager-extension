# Checks every pull request and every push to main: the same `make verify` you
# run locally, plus a build of the Zed Open droplet.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    # macOS: the tests use the system sqlite3 and the droplet needs osacompile.
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # Same as Tinycast's "Install from GitHub": no dependency install scripts.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Install ShellCheck
        run: command -v shellcheck >/dev/null || brew install shellcheck

      # build, typecheck, ESLint + Prettier, unit tests, ShellCheck
      - name: Verify
        run: make verify

      - name: Build droplet
        run: |
          make droplet DROPLET_DIR="$RUNNER_TEMP/droplet"
          codesign --verify --deep --strict "$RUNNER_TEMP/droplet/Zed Open.app"
