  <circle cx="126" cy="221" r="7" fill="#4f8cff"/>
  <circle cx="148" cy="221" r="7" fill="#4f8cff"/>
  <!-- Z mark on the front window -->
  <path d="M166 282 H280 L176 358 H290" fill="none" stroke="#e8eefc" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- search lens -->
